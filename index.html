<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Green Hill · Map Game</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f7f5;--card:#fff;--ink:#1B2A33;--mut:#5a6a72;--line:#dbe3e0;--teal:#0F4C5C;--co:#FF6B4A;--soft:#EEF3EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e181d;--card:#16242b;--ink:#e8f1f2;--mut:#9db1b6;--line:#2a3d45;--teal:#7fd1c7;--soft:#1d2f37}}
:root[data-theme="dark"]{--bg:#0e181d;--card:#16242b;--ink:#e8f1f2;--mut:#9db1b6;--line:#2a3d45;--teal:#7fd1c7;--soft:#1d2f37}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:18px 20px 6px;max-width:1200px;margin:auto}h1{font:700 clamp(26px,4vw,38px) Cambria,Georgia,serif;margin:0;color:var(--teal)}header p{margin:4px 0 0;color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;padding:12px 20px 28px;max-width:1200px;margin:auto}
@media(max-width:880px){main{grid-template-columns:1fr;padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.mapc{align-self:start}svg{width:100%;height:auto;display:block}
.sl{font:700 11px system-ui,Arial,sans-serif;fill:#3C4A52;text-anchor:middle;dominant-baseline:central}
.be{font-size:32px;text-anchor:middle}.bn{font:700 14px system-ui,Arial,sans-serif;fill:#fff;text-anchor:middle}.bd{font:700 12px system-ui,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.pl{cursor:pointer;outline:none}.pl rect{transition:filter .15s}.pl:hover rect,.pl:focus-visible rect{filter:brightness(1.15);stroke:#1B2A33;stroke-width:4}.pl.on rect{stroke:#1B2A33;stroke-width:4}.pl.ok rect{stroke:#1db954;stroke-width:6}.pl.no rect{stroke:#e02424;stroke-width:6}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);padding:10px 4px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
#tabs button{border:0;background:none;color:var(--mut);font:600 14px inherit;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit}
#tabs button[aria-selected=true]{background:var(--teal);color:var(--bg)}
button.b,.chips button,.rb button{font:600 14px inherit;font-family:inherit;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
button.b{background:var(--co);border-color:var(--co);color:#fff}
.chips,.rb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
h2{font:700 24px Cambria,Georgia,serif;margin:6px 0;color:var(--teal)}h3{font-size:15px;margin:14px 0 4px;color:var(--teal)}
.mut{color:var(--mut);font-size:14px}.big{font-size:56px;line-height:1}.tag{display:inline-block;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
#st{padding-left:0;list-style:none;margin:10px 0}#st li{padding:8px 10px 8px 12px;border-radius:10px;margin-bottom:4px;opacity:.55;transition:.2s;display:flex;gap:10px}#st li.on{opacity:1;background:var(--soft);font-weight:600}#st li b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-size:13px}
.clue{font-size:20px;font-style:italic;margin:10px 0}.tp p{margin:8px 0}.tr span{padding:1px 2px;border-radius:4px;transition:.2s}.tr span.on{background:var(--co);color:#fff}
a{color:var(--teal);word-break:break-all}.ref{margin:0 0 10px;padding-left:22px;text-indent:-22px;font-size:14px}audio{width:100%;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>🗺️ Green Hill · Map Game</h1><p>Find the place: click the map, follow the routes and test your directions in English.</p><p style="font-size:14px">Jhon Alexander Ramos Vides · Ingeniería de Software, UNIMINUTO · Inglés I (NRC 70765)</p></header>
<main><section class="card mapc"><svg id="map" viewBox="0 0 710 460" role="img" aria-label="Map of the Green Hill neighborhood"></svg><div class="lg" id="lg"></div></section>
<section class="card"><div id="tabs" role="tablist"></div><div id="pn"></div></section></main>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const CAT={edu:['Education','#7C5CC4'],health:['Health','#D64933'],money:['Money','#B7791F'],shop:['Shops & food','#D9731A'],fun:['Leisure','#208A55'],go:['Transport','#2E86DE']};
const P=[
['School','🏫','edu',0,0,'A big school with a playground. Students study here from Monday to Friday.','In the northwest, on the corner of First Street and Maple Street.'],
['Park','🌳','fun',1,0,'A green park with trees and benches. It is quiet and I like to relax here.','North of Maple Street, between First Street and Central Avenue.'],
['Library','📚','edu',2,0,'A quiet place to read books and study. It has free Wi-Fi.','On Maple Street, between Central Avenue and Station Road.'],
['Hospital','🏥','health',3,0,'The hospital takes care of sick people day and night.','In the northeast, on the corner of Maple Street and Station Road.'],
['Café','☕','shop',1,1,'A cozy café with coffee and fresh bread. It is close to my house.','Opposite my house, near the roundabout.'],
['Bank','🏦','money',2,1,'You can take out money and pay your bills here.','On Oak Street, between the café and the pharmacy.'],
['Pharmacy','💊','health',3,1,'Here you can buy medicine and health products.','On Oak Street, opposite the bakery and next to Station Road.'],
['Supermarket','🛒','shop',0,2,'A big supermarket with fruit, vegetables and bread.','South of Oak Street, opposite the clothing store.'],
['Clothing Store','👕','shop',1,2,'A shop with jackets, jeans and shoes.','Near the cinema, opposite the supermarket.'],
['Cinema','🎬','fun',2,2,'We watch movies here on weekends.','On Oak Street, opposite the bank.'],
['Bakery','🥐','shop',3,2,'It sells fresh bread and cakes every morning.','At the end of Oak Street, opposite the pharmacy.'],
['Subway Station','🚇','go',4,1,'The subway takes you to the city centre.','Across the river. Cross the bridge to get there.']];
const R=[
{to:'Supermarket',t:2,pts:[[136,230],[136,308],[136,370]],m:[0,.05,.52,.85],s:['Leave the house and turn right on First Street.','Walk south and go straight on to the traffic lights.','Cross Oak Street.','The supermarket is on your right, opposite the clothing store.']},
{to:'School',t:3,pts:[[136,230],[136,152],[136,75]],m:[0,.05,.5,.85],s:['Leave the house and turn left on First Street.','Walk north to Maple Street.','Cross the street at the crosswalk.','The school is on your left, on the corner.']},
{to:'Library',t:7,pts:[[136,230],[136,152],[276,152],[346,152]],m:[0,.27,.35,.7,.85],s:['Turn left on First Street and walk north to Maple Street.','Turn right and go straight east.','Go past the park and the café.','At the roundabout, go straight on.','The library is on your left, between Central Avenue and Station Road.']},
{to:'Pharmacy',t:10,pts:[[136,230],[136,308],[486,308]],m:[0,.18,.3,.78,.9],s:['Turn right on First Street and walk south to the traffic lights.','Turn left on Oak Street.','Go past the café and the bank.','Cross Station Road at the traffic lights.','The pharmacy is on your left, opposite the bakery.']},
{to:'Subway Station',t:12,pts:[[136,230],[136,308],[595,308]],m:[0,.3,.68,.88,.96],s:['Follow the directions to the pharmacy.','Go straight on along Oak Street.','Go past the bakery.','Cross the bridge over the river.','The subway station is in front of you.']}];
const TR=['Hello! Welcome to my neighborhood. I live in Green Hill, a small and quiet neighborhood with five streets and twelve places. In the north, there is a school, a park, a library and a hospital. In the middle, there is a café, a bank and a pharmacy. In the south, there is a supermarket, a clothing store, a cinema and a bakery. On the east side, there is a river, and you cross a bridge to get to the subway station. My favorite place is the park because it is green and very quiet. I also like the café because it is close to my house.',
'Now I will explain how to get from my house to the library. It is a short and easy route. First, leave my house and turn left on First Street. Walk north until you reach Maple Street, near the school. Then turn right and go straight east on Maple Street. You will pass the park on your left and the café on your right. After that, you will see a big roundabout with a fountain in the middle. Do not turn. Go straight at the roundabout and keep walking on Maple Street. Finally, you will see the library on your left, between Central Avenue and Station Road. It is about seven minutes on foot.',
'The library is a quiet place, and it has free Wi-Fi. After you study, you can walk back to the park and relax for a while. Or you can have a coffee at the café, because it is on the same route. Thank you very much for listening, and enjoy Green Hill!'];
const DESC='I live in Green Hill, a small neighborhood with five streets and twelve places. The school and the park are in the north, near the roundabout. The café, the bank and the pharmacy are in the middle, along Oak Street. In the south there is a big supermarket, a cinema and a bakery. I like the park because it is quiet and green, and I like the café because it is close to my house. A river runs on the east side, and you cross a bridge to get to the subway station.';
const REFL='Making this map helped me learn directions in a practical way. The most useful expressions were “turn left,” “go straight on” and “next to.” The hardest one for me was “opposite,” because I often confuse it with “in front of.” Drawing the map first helped me organize the routes, and recording my voice helped me notice my pronunciation. I used imperatives, prepositions of place and connectors like “first,” “then” and “after that” to make the directions clear. I think these skills are useful when I travel or when a tourist asks me for help.';
const REFS=['British Council. (s. f.). _Giving directions_ [Actividad de comprensión auditiva, nivel A2]. LearnEnglish Teens. https://learnenglishteens.britishcouncil.org/skills/listening/a2-listening/giving-directions','Escobar Álvarez, M. Á. (Coord.). (2020). _Curso de inglés para adultos_. UNED. https://elibro.net/es/ereader/uniminuto/149565','Muñoz Ortiz, F. (2020). _Inglés A1_. Editorial Tutor Formación. https://elibro.net/es/ereader/uniminuto/130406','Quinn, P. M. (2023). _Introducción a la gramática inglesa: guía gramatical para hispanoparlantes_ (1.ª ed.). Editorial Unimagdalena. https://elibro.net/es/ereader/uniminuto/229192','Smith, S. (2025, 4 de febrero). _Love to travel? Here’s how to give directions in English_. British Council Singapore. https://www.britishcouncil.sg/blog/give-directions-english','Test-English. (s. f.-a). _Giving directions – A2 English vocabulary_. https://test-english.com/vocabulary/a2/giving-directions-a2-english-vocabulary/','Test-English. (s. f.-b). _Next to, under, between, in front of, behind, over, etc._ https://test-english.com/grammar-points/a1/next-to-under-between-in-front-behind-etc/'];
const AUDIO_SRC='audio/route-to-library.mp3';
// ---- map
const cx=c=>10+c*140,sx=i=>122+i*140,ry=r=>10+r*156,my=j=>138+j*156,rx=542;
let h='<rect width="710" height="460" rx="14" fill="#EEF3EF"/>';
[0,1,2].forEach(i=>h+=`<rect x="${sx(i)}" y="10" width="28" height="440" fill="#C8D0D4"/>`);
[0,1].forEach(j=>h+=`<rect x="10" y="${my(j)}" width="${rx-10}" height="28" fill="#C8D0D4"/>`);
h+=`<rect x="${rx}" y="10" width="35" height="440" fill="#9AD1F0"/><rect x="${rx-2}" y="${my(1)}" width="39" height="28" fill="#B08D57"/>`;
['Maple Street','Oak Street'].forEach((n,j)=>h+=`<text class="sl" x="${cx(1)+56}" y="${my(j)+14}">${n}</text>`);
['First Street','Central Avenue','Station Road'].forEach((n,i)=>{const X=sx(i)+14;h+=`<text class="sl" x="${X}" y="76" transform="rotate(-90 ${X} 76)">${n}</text>`});
h+=`<text class="sl" style="fill:#1F5F8B" x="559" y="76" transform="rotate(-90 559 76)">River</text>`;
P.forEach((p,i)=>{const e=p[3]==4,x=(e?577:cx(p[3]))+5,y=(e?244:ry(p[4]))+5,w=e?113:102,c=CAT[p[2]][1],ls=p[0].length>10&&p[0].includes(' ')?p[0].split(' '):[p[0]];
h+=`<g class="pl" data-i="${i}" tabindex="0" role="button" aria-label="${p[0]}"><rect x="${x}" y="${y}" width="${w}" height="118" rx="10" fill="${c}"/><text class="be" x="${x+w/2}" y="${y+58}">${p[1]}</text>${ls.map((l,k)=>`<text class="bn" x="${x+w/2}" y="${y+84+k*16}">${l}</text>`).join('')}<circle cx="${x+16}" cy="${y+16}" r="11" fill="#fff"/><text class="bd" x="${x+16}" y="${y+16}" fill="${c}">${i+1}</text></g>`});
h+=`<rect x="15" y="171" width="102" height="118" rx="10" fill="#FF6B4A"/><text class="be" x="66" y="229">🏠</text><text class="bn" x="66" y="255">Home</text><text class="bn" x="66" y="271" style="font-size:11px">(start)</text>`;
h+=`<circle cx="276" cy="152" r="26" fill="#8E99A0"/><circle cx="276" cy="152" r="15" fill="#7ED6A0"/><text x="276" y="153" font-size="14" text-anchor="middle" dominant-baseline="central">⛲</text>`;
[[136,308,'🚦'],[416,308,'🚦'],[136,152,'🚸']].forEach(a=>h+=`<text x="${a[0]}" y="${a[1]+1}" font-size="14" text-anchor="middle" dominant-baseline="central">${a[2]}</text>`);
h+=`<g transform="translate(638 100)"><circle r="38" fill="#fff" stroke="#5A6A72" stroke-width="2"/><polygon points="0,-30 -6,0 6,0" fill="#FF6B4A"/><polygon points="0,30 -6,0 6,0" fill="#8E99A0"/><g class="sl" style="font-size:13px;fill:#1B2A33"><text y="-47" style="fill:#FF6B4A">N</text><text y="48">S</text><text x="50">E</text><text x="-50">W</text></g></g>`;
h+=`<path id="rt" fill="none" stroke="#FF6B4A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/><text id="wk" font-size="26" pointer-events="none"></text>`;
$('#map').innerHTML=h;
$('#lg').innerHTML=Object.values(CAT).concat([['Home','#FF6B4A']]).map(l=>`<span><i style="background:${l[1]}"></i>${l[0]}</span>`).join('')+'<span>🚦 Traffic lights</span><span>⛲ Roundabout</span><span>🚸 Crosswalk</span><span><i style="background:#B08D57"></i>Bridge</span>';
// ---- tabs
const TABS=[['places','Places'],['routes','Routes'],['game','Game'],['audio','Audio'],['text','Text'],['refs','Sources']];
$('#tabs').innerHTML=TABS.map(t=>`<button role="tab" id="t-${t[0]}" data-t="${t[0]}">${t[1]}</button>`).join('');
$('#pn').innerHTML=TABS.map(t=>`<div class="tp" id="p-${t[0]}" hidden></div>`).join('');
let cur='places';
function tab(k){cur=k;TABS.forEach(t=>{$('#p-'+t[0]).hidden=t[0]!=k;$('#t-'+t[0]).setAttribute('aria-selected',t[0]==k)});if(k!='routes')clearRoute()}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)};
// places
$('#p-places').innerHTML=`<p class="mut">Click a place on the map, or choose one here.</p><div class="chips">${P.map((p,i)=>`<button data-i="${i}">${p[1]} ${p[0]}</button>`).join('')}</div><div id="card"></div>`;
function show(i){$$('.pl').forEach(g=>g.classList.toggle('on',g.dataset.i==i));const p=P[i],c=CAT[p[2]];
$('#card').innerHTML=`<div class="big">${p[1]}</div><h2>${p[0]}</h2><span class="tag" style="background:${c[1]}">${c[0]}</span><p>${p[5]}</p><h3>Where is it?</h3><p>${p[6]}</p>`}
$('#p-places .chips').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.i)};
// routes
$('#p-routes').innerHTML=`<p class="mut">Choose a destination. The walker starts at Home.</p><div class="rb">${R.map((r,i)=>`<button data-i="${i}">→ ${r.to}</button>`).join('')}</div><div id="rinfo"></div>`;
let raf=0;
function clearRoute(){cancelAnimationFrame(raf);$('#rt').removeAttribute('d');$('#wk').textContent='';$$('.pl').forEach(g=>g.classList.remove('ok'))}
function play(i){clearRoute();const r=R[i],pt=$('#rt'),wk=$('#wk');
$('#rinfo').innerHTML=`<h2>Home → ${r.to}</h2><p class="mut">It’s ${r.t} minutes on foot.</p><ol id="st">${r.s.map((s,j)=>`<li><b>${j+1}</b><span>${s}</span></li>`).join('')}</ol><button class="b" id="rp">↻ Replay</button>`;
$('#rp').onclick=()=>play(i);
pt.setAttribute('d','M'+r.pts.map(p=>p.join(',')).join(' L'));const L=pt.getTotalLength(),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
pt.style.strokeDasharray=L;wk.textContent='🚶';const t0=performance.now(),D=L*18;
const f=n=>{const p=still?1:Math.min(1,(n-t0)/D),q=pt.getPointAtLength(L*p);pt.style.strokeDashoffset=L*(1-p);wk.setAttribute('x',q.x-13);wk.setAttribute('y',q.y+9);
let k=0;r.m.forEach((m,j)=>{if(p>=m)k=j});$$('#st li').forEach((li,j)=>li.classList.toggle('on',j==k));
if(p<1)raf=requestAnimationFrame(f);else{const g=$$('.pl')[P.findIndex(x=>x[0]==r.to)];g&&g.classList.add('ok')}};
raf=requestAnimationFrame(f)}
$('#p-routes .rb').onclick=e=>{const b=e.target.closest('button');if(b)play(+b.dataset.i)};
// game
const G={left:[],q:null,s:0,n:0,a:false};
function gNew(){G.left=P.map((_,i)=>i).sort(()=>Math.random()-.5);G.s=0;G.n=0;gNext()}
function gNext(){$$('.pl').forEach(g=>g.classList.remove('ok','no'));const el=$('#p-game');
if(!G.left.length){G.q=null;el.innerHTML=`<h2>Final score: ${G.s} / 12</h2><p>${G.s>10?'Excellent! You know Green Hill very well.':G.s>6?'Good job! Try again to improve.':'Keep practicing the directions.'}</p><button class="b" id="gr">Play again</button>`;$('#gr').onclick=gNew;return}
G.q=G.left.pop();G.n++;G.a=false;
el.innerHTML=`<p class="mut">Question ${G.n} of 12 · Score ${G.s}</p><h2>Where is it?</h2><p class="clue">“${P[G.q][6]}”</p><p id="gf" class="mut">Click the place on the map.</p><div class="rb"><button id="gh">Hint</button></div>`;
$('#gh').onclick=()=>$('#gf').textContent='Hint: it is a '+CAT[P[G.q][2]][0].toLowerCase()+' place.'}
function guess(i){if(G.q==null||G.a)return;G.a=true;const ok=i==G.q,gs=$$('.pl');gs[G.q].classList.add('ok');if(ok)G.s++;else gs[i].classList.add('no');
$('#gf').textContent=ok?'✅ Correct!':`❌ Not quite. It is the ${P[G.q][0]}.`;$('#gh').outerHTML=`<button class="b" id="gn">${G.left.length?'Next →':'See my score'}</button>`;$('#gn').onclick=gNext}
// audio
const sent=TR.map(p=>p.split(/(?<=[.!?])\s+/));let k=0;
$('#p-audio').innerHTML=`<h2>Audio: from my house to the library</h2><p class="mut">Listen and follow the transcript.</p><audio id="au" controls preload="auto" ${AUDIO_SRC?`src="${AUDIO_SRC}"`:'hidden'}></audio>${AUDIO_SRC?'':'<p class="mut"><label>Preview my recording: <input type="file" id="af" accept="audio/*"></label></p>'}<div class="tr">${sent.map(p=>`<p>${p.map(s=>`<span id="s${k++}">${s}</span>`).join(' ')}</p>`).join('')}</div>`;
const flat=sent.flat(),tot=flat.join(' ').length,au=$('#au');
if($('#af'))$('#af').onchange=e=>{const f=e.target.files[0];if(f){au.src=URL.createObjectURL(f);au.hidden=false}};
au.ontimeupdate=()=>{if(!au.duration)return;const fr=au.currentTime/au.duration;let acc=0,a=0;flat.forEach((s,j)=>{if(fr>=acc/tot)a=j;acc+=s.length+1});flat.forEach((_,j)=>$('#s'+j).classList.toggle('on',j==a))};
au.onended=()=>flat.forEach((_,j)=>$('#s'+j).classList.remove('on'));
// text + refs
$('#p-text').innerHTML=`<h2>My neighborhood</h2><p>${DESC}</p><h2>Creative feedback</h2><p>${REFL}</p>`;
const it=s=>s.split('_').map((t,i)=>i%2?`<i>${t}</i>`:t).join('').replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
$('#p-refs').innerHTML=`<h2>References</h2>${REFS.map(r=>`<p class="ref">${it(r)}</p>`).join('')}`;
// events
const pick=i=>{if(cur=='game')guess(i);else{tab('places');show(i)}};
$('#map').onclick=e=>{const g=e.target.closest('.pl');if(g)pick(+g.dataset.i)};
$('#map').onkeydown=e=>{const g=e.target.closest('.pl');if(g&&(e.key=='Enter'||e.key==' ')){e.preventDefault();pick(+g.dataset.i)}};
tab('places');gNew();
</script></body></html>
